# .github/workflows/cloudflare-deploy.yml
#
# Cloudflare Workers deploy for nexapp · Linux CI resolves the
# Windows NTFS symlink blocker that prevents local OpenNext builds.
#
# Manual-only (workflow_dispatch). Never fires on push. Per
# CLAUDE.md §4 and §5 each deploy is a separate explicit action.
#
# -----------------------------------------------------------------------
# Required GitHub Actions repository secrets BEFORE first PREVIEW deploy:
#
#   · CLOUDFLARE_API_TOKEN
#       Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers"
#       template, scoped to account `nex`.
#
#   · CLOUDFLARE_ACCOUNT_ID
#       Value: a46ee668c0b1bc53b2de925e5b4bcd0a   (not a secret, but
#       stored here so the workflow is portable between accounts.)
#
#   · NEX_SANDBOX_SUPABASE_URL
#       Example: https://kdstoyyeygcopkogqsyv.supabase.co
#       Used at BUILD time (so Next.js inlines NEXT_PUBLIC_NEX_SUPABASE_URL
#       into the client bundle) AND installed as a runtime Worker secret.
#
#   · NEX_SANDBOX_SUPABASE_ANON_KEY
#       Supabase → sandbox project → Settings → API → "anon public".
#       Used at BUILD time AND installed as a runtime Worker secret.
#
#   · NEX_SANDBOX_SUPABASE_SERVICE_ROLE_KEY
#       Supabase → sandbox project → Settings → API → "service_role".
#       Installed as a runtime Worker secret ONLY. Never used at build.
#       Never prefixed with NEXT_PUBLIC_. Never bundled client-side.
#
# -----------------------------------------------------------------------
# Required BEFORE first PRODUCTION deploy (separate owner approval):
#
#   · NEX_PROD_SUPABASE_URL
#   · NEX_PROD_SUPABASE_ANON_KEY
#   · NEX_PROD_SUPABASE_SERVICE_ROLE_KEY
#
# Additional runtime secrets (Brevo, Stripe test, LLM keys) are added
# only when the owner authorises the corresponding surface.

name: Cloudflare Workers deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment · preview (sandbox) or production"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Record deploy commit sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Validate preview secrets present
        if: ${{ inputs.environment == 'preview' }}
        env:
          URL: ${{ secrets.NEX_SANDBOX_SUPABASE_URL }}
          ANON: ${{ secrets.NEX_SANDBOX_SUPABASE_ANON_KEY }}
          KEY: ${{ secrets.NEX_SANDBOX_SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCT" ]  && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$URL" ]   && missing="$missing NEX_SANDBOX_SUPABASE_URL"
          [ -z "$ANON" ]  && missing="$missing NEX_SANDBOX_SUPABASE_ANON_KEY"
          [ -z "$KEY" ]   && missing="$missing NEX_SANDBOX_SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secrets:$missing"
            exit 1
          fi

      - name: Validate production secrets present
        if: ${{ inputs.environment == 'production' }}
        env:
          URL: ${{ secrets.NEX_PROD_SUPABASE_URL }}
          ANON: ${{ secrets.NEX_PROD_SUPABASE_ANON_KEY }}
          KEY: ${{ secrets.NEX_PROD_SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCT" ]  && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$URL" ]   && missing="$missing NEX_PROD_SUPABASE_URL"
          [ -z "$ANON" ]  && missing="$missing NEX_PROD_SUPABASE_ANON_KEY"
          [ -z "$KEY" ]   && missing="$missing NEX_PROD_SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secrets:$missing"
            exit 1
          fi

      - name: Build OpenNext Workers bundle (preview)
        if: ${{ inputs.environment == 'preview' }}
        env:
          NEX_GIT_COMMIT_SHA: ${{ steps.sha.outputs.sha }}
          # Build-time NEXT_PUBLIC_* values so Next.js inlines them
          # into the client bundle. Service-role key is NEVER set here.
          NEXT_PUBLIC_NEX_SUPABASE_URL: ${{ secrets.NEX_SANDBOX_SUPABASE_URL }}
          NEXT_PUBLIC_NEX_SUPABASE_ANON_KEY: ${{ secrets.NEX_SANDBOX_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_ENV: preview
        run: npx opennextjs-cloudflare build

      - name: Build OpenNext Workers bundle (production)
        if: ${{ inputs.environment == 'production' }}
        env:
          NEX_GIT_COMMIT_SHA: ${{ steps.sha.outputs.sha }}
          NEXT_PUBLIC_NEX_SUPABASE_URL: ${{ secrets.NEX_PROD_SUPABASE_URL }}
          NEXT_PUBLIC_NEX_SUPABASE_ANON_KEY: ${{ secrets.NEX_PROD_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_SITE_URL: https://nexcorner.com
          NEX_SITE_URL: https://nexcorner.com
        run: npx opennextjs-cloudflare build

      - name: Push runtime secrets to Worker (preview)
        if: ${{ inputs.environment == 'preview' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          URL: ${{ secrets.NEX_SANDBOX_SUPABASE_URL }}
          ANON: ${{ secrets.NEX_SANDBOX_SUPABASE_ANON_KEY }}
          KEY: ${{ secrets.NEX_SANDBOX_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          printf '%s' "$URL"  | npx wrangler secret put NEX_SUPABASE_URL                    --env preview
          printf '%s' "$URL"  | npx wrangler secret put NEXT_PUBLIC_NEX_SUPABASE_URL        --env preview
          printf '%s' "$ANON" | npx wrangler secret put NEXT_PUBLIC_NEX_SUPABASE_ANON_KEY   --env preview
          printf '%s' "$KEY"  | npx wrangler secret put NEX_SUPABASE_SERVICE_ROLE_KEY       --env preview

      - name: Push runtime secrets to Worker (production)
        if: ${{ inputs.environment == 'production' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          URL: ${{ secrets.NEX_PROD_SUPABASE_URL }}
          ANON: ${{ secrets.NEX_PROD_SUPABASE_ANON_KEY }}
          KEY: ${{ secrets.NEX_PROD_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          printf '%s' "$URL"  | npx wrangler secret put NEX_SUPABASE_URL
          printf '%s' "$URL"  | npx wrangler secret put NEXT_PUBLIC_NEX_SUPABASE_URL
          printf '%s' "$ANON" | npx wrangler secret put NEXT_PUBLIC_NEX_SUPABASE_ANON_KEY
          printf '%s' "$KEY"  | npx wrangler secret put NEX_SUPABASE_SERVICE_ROLE_KEY

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env preview
          fi

      - name: Summary
        run: |
          echo "### Cloudflare deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ steps.sha.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Worker name (preview): nexapp-preview" >> $GITHUB_STEP_SUMMARY
          echo "- Worker name (production): nexapp" >> $GITHUB_STEP_SUMMARY
