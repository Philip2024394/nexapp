# .github/workflows/cloudflare-deploy.yml
#
# Cloudflare Workers deploy for nexapp · Linux CI resolves the
# Windows NTFS symlink blocker that prevents local OpenNext builds.
#
# Manual-only (workflow_dispatch). Never fires on push. Per
# CLAUDE.md §4 and §5 each deploy is a separate explicit action.
#
# Required GitHub Actions secrets BEFORE first preview deploy:
#   · CLOUDFLARE_API_TOKEN       — scoped for Workers Scripts:Edit
#   · CLOUDFLARE_ACCOUNT_ID      — nex account id (not secret but
#                                   stored here so the workflow is
#                                   portable between accounts)
#   · NEX_SANDBOX_SUPABASE_URL   — sandbox project kdstoyyeygcopkogqsyv url
#   · NEX_SANDBOX_SUPABASE_SERVICE_ROLE_KEY
#                                — sandbox service-role key
#
# Required BEFORE first production deploy (separate approval):
#   · NEX_PROD_SUPABASE_URL
#   · NEX_PROD_SUPABASE_SERVICE_ROLE_KEY
#   · any additional runtime secrets the shipping surface needs
#     (Brevo, Stripe test, LLM keys) as the owner authorises them.

name: Cloudflare Workers deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment · preview (sandbox) or production"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Record deploy commit sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Build OpenNext Workers bundle
        env:
          NEX_GIT_COMMIT_SHA: ${{ steps.sha.outputs.sha }}
        run: npx opennextjs-cloudflare build

      - name: Push Supabase secrets to Worker (sandbox)
        if: ${{ inputs.environment == 'preview' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          URL: ${{ secrets.NEX_SANDBOX_SUPABASE_URL }}
          KEY: ${{ secrets.NEX_SANDBOX_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Sandbox Supabase secrets missing. Add NEX_SANDBOX_SUPABASE_URL and NEX_SANDBOX_SUPABASE_SERVICE_ROLE_KEY to repo Actions secrets."
            exit 1
          fi
          printf '%s' "$URL" | npx wrangler secret put NEX_SUPABASE_URL --env preview
          printf '%s' "$URL" | npx wrangler secret put NEXT_PUBLIC_NEX_SUPABASE_URL --env preview
          printf '%s' "$KEY" | npx wrangler secret put NEX_SUPABASE_SERVICE_ROLE_KEY --env preview

      - name: Push Supabase secrets to Worker (production)
        if: ${{ inputs.environment == 'production' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          URL: ${{ secrets.NEX_PROD_SUPABASE_URL }}
          KEY: ${{ secrets.NEX_PROD_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Production Supabase secrets missing. Add NEX_PROD_SUPABASE_URL and NEX_PROD_SUPABASE_SERVICE_ROLE_KEY to repo Actions secrets."
            exit 1
          fi
          printf '%s' "$URL" | npx wrangler secret put NEX_SUPABASE_URL
          printf '%s' "$URL" | npx wrangler secret put NEXT_PUBLIC_NEX_SUPABASE_URL
          printf '%s' "$KEY" | npx wrangler secret put NEX_SUPABASE_SERVICE_ROLE_KEY

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env preview
          fi

      - name: Summary
        run: |
          echo "### Cloudflare deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ steps.sha.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Verify at: https://dash.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/overview" >> $GITHUB_STEP_SUMMARY
